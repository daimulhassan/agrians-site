<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agrians</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1d3a2a 0%,#0f1f17 60%);color:#eef5ef;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
main{max-width:640px}
.mark{width:64px;height:64px;margin:0 auto 28px;border-radius:16px;background:#7bd389;color:#0f1f17;display:grid;place-items:center;font-weight:800;font-size:34px}
h1{font-size:clamp(2.4rem,7vw,3.8rem);letter-spacing:-.02em;margin-bottom:14px}
p{color:#a9bfb0;font-size:1.1rem;line-height:1.6}
.tag{display:inline-block;margin-top:28px;padding:8px 16px;border:1px solid #2f5440;border-radius:999px;font-size:.9rem;color:#7bd389}
</style>
</head>
<body>
<main>
<div class="mark">A</div>
<h1>Agrians</h1>
<p>Our new website is on its way. Check back soon.</p>
<span class="tag">Coming soon</span>
</main>
</body>
</html>
